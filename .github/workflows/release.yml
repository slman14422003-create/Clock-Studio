name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.1)'
        required: true
        default: '1.0'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          [ -n "$V" ] || { echo "::error::empty version"; exit 1; }
          echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - name: Guard (exported components)
        run: |
          M=app/src/main/AndroidManifest.xml
          EXP="$(grep -B1 'android:exported="true"' $M | grep -o 'android:name="[^"]*"' | sort | tr '\n' ' ')"
          [ "$EXP" = 'android:name=".MainActivity" ' ] || { echo "::error::only MainActivity may be exported (found: $EXP)"; exit 1; }
          grep -q 'android:allowBackup="false"' $M || { echo "::error::backup must stay disabled"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets are missing, a release must be signed with the permanent key"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=${KEY_ALIAS:-clock}"
            echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify signature
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/cert.txt"
          grep -q "Signer #1 certificate DN: CN=Clock Studio" "$RUNNER_TEMP/cert.txt" || { echo "::error::APK is not signed with the permanent key"; exit 1; }

      - name: Collect files
        run: |
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/release/*.apk | head -n1)" "dist/Clock-Studio-${TAG}.apk"
          (cd dist && sha256sum "Clock-Studio-${TAG}.apk" > "Clock-Studio-${TAG}.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: Clock-release-${{ env.TAG }}
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRE: ${{ inputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRE" = "true" ] && FLAGS="--prerelease"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Clock Studio ${TAG}" --generate-notes --target "$GITHUB_SHA" $FLAGS
          fi
